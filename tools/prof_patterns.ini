# Slow patterns tools/prof.py looks for in a profile (docs/machine/profiling.md, "Patterns").
# A section a pattern. kind: loop (a loop of core 0 found by its branch back) or function (a
# function by its name, from the call edges). seq: a regular expression over the loop body's
# mnemonics in address order; function: one over the function's name; when: a Python
# expression over the features (loop: n, loads, stores, calls, divs, floats, branches, lbu, sb,
# lw, sw, step1, andi255, system, atomics, per, trips; function: calls, per, share, inclusive).
# Add one whenever a profile shows a slow thing that has a known better form.

[byte-copy]
kind = loop
seq = \blbu?\b.*\bsb\b
when = n <= 10 and lbu >= 1 and sb >= 1 and calls == 0 and per <= 12
why = bytes copied one at a time: some 6 instructions a byte
instead = memcpy (16 words a turn, linux/userland/memcpy.S); megabytes to borrowed workers (linux/apps/ui_bulk.h)

[byte-fill]
kind = loop
seq = \bsb\b
when = n <= 6 and loads == 0 and stores == 1 and sb == 1 and calls == 0
why = memory filled a byte at a time
instead = memset; a table is not cleared whole at every page or frame (AGENTS.md, css_reset)

[crc-bytewise]
kind = loop
seq = \blbu\b.*\bxor\b.*\bandi\b.*\bslli\b.*\blw\b.*\bsrli\b.*\bxor\b|\blbu\b.*\bxor\b.*\bslli\b.*\badd\b.*\blw\b
when = n <= 16 and andi255 >= 1
why = CRC-32 a byte at a time through a table of 256: some 9 instructions a byte
instead = slice-by-4 or -8 tables; pieces on workers joined with crc32_combine (libmedia's media_crc32)

[polling-wait]
kind = loop
when = stores == 0 and calls == 0 and n <= 8 and loads >= 1 and adds == 0 and trips >= 1000 and system == 0
why = a wait turning in place on a word: the whole pass for nothing
instead = mcw_rest() on a program's first core, mc_end_pass() in a job, or block in the kernel (docs/machine/multicore.md, "A core that rests")

[division-in-loop]
kind = loop
when = divs >= 1 and per <= 60
why = a division in a short loop: the machine's div is one instruction but the loop usually divides by the same number
instead = a reciprocal or a shift computed once outside the loop

[software-float]
kind = function
function = ^__(add|sub|mul|div)[sd]f3$|^__(fix|float)\w+[sd]i$|^__(eq|ne|lt|le|gt|ge)[sd]f2$
when = share >= 0.01
why = floats done by the C runtime's routines (double, or code built without F)
instead = single precision with the machine's F instructions (docs/machine/fpu.md, -fsingle-precision-constant)

[large-clear]
kind = function
function = ^(memset|bzero|calloc|__memset\w*)$
when = per >= 20000 and share >= 0.01
why = whole tables or buffers cleared, tens of thousands of instructions a call
instead = clear only what is used, keep a generation count, or take memory from the kernel's cleared pool (zeropool_hook.py)

[large-copy]
kind = function
function = ^(memcpy|memmove|bcopy)$
when = per >= 20000 and share >= 0.02
why = large copies on core 0
instead = make a decoded piece where it will lie (piece_place in nxplay.c); megabytes to borrowed workers (ui_bulk.h)

[many-small-copies]
kind = function
function = ^(memcpy|memmove|memset|strlen|strcmp|strncmp|memcmp)$
when = calls >= 100000 and per <= 60 and share >= 0.02
why = a library call for a few bytes, hundreds of thousands of times
instead = inline it, or keep the length (strlen) instead of finding it again

[char-at-a-time-io]
kind = function
function = ^(fputc|putc|_IO_putc|fgetc|getc|putchar|__overflow|__uflow)$
when = calls >= 10000 and share >= 0.01
why = stdio a character a call: some 70 instructions each
instead = fill a buffer and write it whole (docs/system/open.md: 76 instructions a pixel became 12)

[allocation-in-loop]
kind = function
function = ^(malloc|free|realloc|calloc|__libc_malloc\w*|__simple_malloc)$
when = calls >= 20000 and share >= 0.02
why = memory taken and given back in a hot path
instead = a pool or a buffer kept between frames

[printf-in-hot-path]
kind = function
function = ^(printf|fprintf|sprintf|snprintf|vfprintf|vsnprintf|printf_core)$
when = share >= 0.02
why = formatted output in a hot path (and a Con_Printf while Quake loads draws a frame)
instead = print less often, or format numbers by hand

[busybox-inflate]
kind = function
function = ^(inflate_codes|inflate_block|inflate_unzip_internal|unpack_gz_stream|inflate_get_next_window)$
when = share >= 0.05
why = busybox's inflate on core 0 alone, about 90 instructions an unpacked byte with its CRC
instead = unarc (linux/apps/unarc.c): libmedia's media_inflate_stream on the workers (docs/system/media.md, "One deflate stream on many cores")

[zlib-inflate]
kind = function
function = ^(inflate|inflate_fast|tinfl_decompress|stbi__parse_huffman_block|puff)$
when = share >= 0.05
why = one deflate stream inflated on core 0
instead = media_inflate_stream (any stream, on the workers) or deflate in segments (media_inflate)

[independent-pixel-loop]
kind = loop
when = stores >= 1 and calls == 0 and divs == 0 and trips >= 100000 and per >= 8 and system == 0
why = a long loop that stores every trip: if its trips do not read each other's (prof.py deps), a mcw_for
instead = mcw_for(n, fn, ctx) with out_bytes so a worker writes whole texels (docs/machine/multicore.md, "The second layer")
